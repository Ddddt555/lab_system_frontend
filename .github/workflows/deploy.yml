name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
  # 在 PR 阶段就运行检查，避免有问题的代码合进 main 之后才发现
  pull_request:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 设置 Node.js 22 环境
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: 3. 安装依赖、规范检查、单元测试与构建
      run: |
        npm ci
        # ESLint 代码规范强制检查（零 Error 才放行）
        npx eslint . 
        # 运行 Vitest 单元测试（测试不通过则阻断流水线）
        npm run test
        # 构建前端产物
        npm run build

    - name: 4. 前端依赖漏洞扫描
      run: |
        # 扫描生产依赖，发现高危(high)及以上级别漏洞时阻断流水线
        npm audit --audit-level=high --omit=dev

    - name: 5. 设置 Docker Buildx
      if: github.event_name != 'pull_request'
      uses: docker/setup-buildx-action@v3

    - name: 6. 登录 Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 7. 构建并推送 Docker 镜像
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # 同时推送 latest 和 Git commit hash
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/labsystem-frontend:latest
          ${{ secrets.DOCKER_USERNAME }}/labsystem-frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 8. 前端镜像安全扫描 (Trivy)
      if: github.event_name != 'pull_request'
      # 直接使用官方 Docker 镜像运行，版本绝对固定，避免下载二进制超时
      run: |
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:0.58.2 image \
          --exit-code 1 \
          --ignore-unfixed \
          --vuln-type os,library \
          --severity CRITICAL,HIGH \
          --format table \
          ${{ secrets.DOCKER_USERNAME }}/labsystem-frontend:${{ github.sha }}