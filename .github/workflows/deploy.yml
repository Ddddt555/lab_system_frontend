name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 设置 Node.js 20 环境
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 3. 安装依赖并构建前端产物 (测试构建)
      run: |
        npm ci
        # 🛑【核心新增】ESLint 代码规范强制检查（零 Error 才放行）
        npx eslint . 
        npm run build

    - name: 4. 设置 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 5. 登录 Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 6. 构建并推送 Docker 镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # 同时推送 latest 和 Git commit hash
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/labsystem-frontend:latest
          ${{ secrets.DOCKER_USERNAME }}/labsystem-frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max