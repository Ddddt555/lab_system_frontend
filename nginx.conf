# 定义日志格式，避免与 Nginx 默认的 main 冲突
# 注意：使用 $request_method 和 $uri 而非 $request，防止将 URL 参数中的票据(ticket)或 Token 记录到日志中
log_format lab_main '$remote_addr - $remote_user [$time_local] "$request_method $uri" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/lab_access.log lab_main;
    error_log  /var/log/nginx/lab_error.log warn;

    # 放宽文件上传大小限制
    client_max_body_size 60m;

    # ================= gzip 压缩配置 =================
    # 开启 gzip 压缩，显著减小 JS/CSS 传输体积
    gzip on;
    # 仅在文件大于 1k 时才进行压缩（太小的文件压缩反而增加开销）
    gzip_min_length 1k;
    # 压缩级别（1-9），6 是体积与 CPU 消耗的折中点
    gzip_comp_level 6;
    # 申请内存大小
    gzip_buffers 4 16k;
    # 需要压缩的 MIME 类型（包含了常见的文本、代码、JSON、SVG 等）
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;
    # 是否在 http header 中添加 Vary: Accept-Encoding
    gzip_vary on;
    # 禁用老版本 IE6 的 gzip
    gzip_disable "msie6";
    # ==================================================

    # 1. 托管前端静态文件
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. 反向代理 API 请求到后端
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. 反向代理 WebSocket 请求到后端
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 4. 安全响应头 (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # 内容安全策略 (CSP)
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss: http: https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

    # HSTS (强制 HTTPS)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}