# 🛑【核心修复】将格式名从 main 改为 lab_main，避免与 Nginx 自带配置冲突
log_format lab_main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name localhost;

    # 🛑【核心新增】将日志输出到指定文件，并引用 lab_main 格式
    access_log /var/log/nginx/lab_access.log lab_main;
    error_log  /var/log/nginx/lab_error.log warn;

    # 放宽文件上传大小限制
    client_max_body_size 60m;

    # 1. 托管前端静态文件
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. 反向代理 API 请求到后端
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. 反向代理 WebSocket 请求到后端
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 4. 添加安全响应头 (Security Headers)
    # 防止点击劫持 (Clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 禁止浏览器 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # 废弃的 XSS 防护，保留用于兼容老浏览器
    add_header X-XSS-Protection "1; mode=block" always;
    # 控制 Referer 发送策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 限制浏览器特性 (禁用地理位置、麦克风、摄像头)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # 内容安全策略 (CSP)
    # 允许加载本地资源、允许内联样式（Element Plus 需要）、允许加载 data 格式图片
    # connect-src 允许自身和 WebSocket (ws: wss:) 连接
    # 【安全加固】script-src 去掉 'unsafe-eval' 和 'unsafe-inline'：
    #   本项目是 Vite 预编译产物 + SFC，运行期不需要 eval，index.html 也没有内联脚本。
    #   保留 unsafe-eval 会让 CSP 对 XSS 的防护基本失效，而 token 存在 localStorage，
    #   一旦发生 XSS 就能被直接读走。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss: http: https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

    # HSTS (强制 HTTPS)
    # 注意：在本地测试用 HTTP 访问时，这行配置可能会让浏览器强制跳转 HTTPS，所以加上条件判断，只在生产环境生效
    # 这里先注释掉，等上了真正的域名和证书后再放开
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}